{% extends "base.html" %}

{% block titulo %}{{ object.titulo }} | Jonathan Carvalho{% endblock %}

{% block conteudo %}
    <article>
        <h1>{{ object.titulo }}</h1>
        <small>{{ object.criado_em|date:"d/m/Y" }}</small>
        {{ object.corpo|linebreaks }}
    </article>
    <a href="{% url 'post_list' %}">Voltar para o blog</a>
{% endblock %}
